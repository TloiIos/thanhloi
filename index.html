<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek AI Chat</title>
    <!-- Font Awesome cho icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #a78bfa;
            --bg-primary: #0b0b12;
            --bg-secondary: #12121a;
            --bg-tertiary: #16161e;
            --bg-card: #1a1a26;
            --bg-hover: #2a2a3e;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --border-color: #2a2a3a;
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-full: 50px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== APP CONTAINER ===== */
        .app-container {
            width: 100%;
            height: 100vh;
            max-width: 1400px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== TITLE BAR ===== */
        .title-bar {
            height: 40px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
            user-select: none;
            border-bottom: 1px solid var(--border-color);
        }

        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-bar-left .icon {
            color: var(--secondary);
            font-size: 16px;
            font-weight: 800;
        }

        .title-bar-left span {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .title-bar-right {
            display: flex;
            gap: 4px;
        }

        .window-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .window-btn.close:hover {
            background: #ef4444;
            color: white;
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
        }

        .sidebar.collapsed {
            width: 64px;
        }

        .sidebar.collapsed .sidebar-content > *:not(.sidebar-header) {
            opacity: 0;
            pointer-events: none;
        }

        .sidebar.collapsed .sidebar-header .brand-text {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* Sidebar Header */
        .sidebar-header {
            padding: 16px 16px 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-tertiary);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .sidebar-header::before {
            content: '';
            position: absolute;
            top: -30%;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 80px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.15), transparent 70%);
            pointer-events: none;
        }

        .sidebar-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1;
        }

        .sidebar-header .brand .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }

        .sidebar-header .brand-text {
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            white-space: nowrap;
        }

        .sidebar-header .brand-text .name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .sidebar-header .brand-text .sub {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .toggle-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            z-index: 1;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* New Chat Button */
        .new-chat-btn {
            margin: 12px 12px 8px 12px;
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .new-chat-btn:hover {
            background: var(--secondary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-glow);
        }

        .new-chat-btn i {
            font-size: 14px;
        }

        /* Conversation List */
        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 8px 8px;
        }

        .conv-list::-webkit-scrollbar {
            width: 4px;
        }

        .conv-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .conv-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .conv-item {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
            position: relative;
        }

        .conv-item:hover {
            background: var(--bg-hover);
        }

        .conv-item.active {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
        }

        .conv-item .title {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .conv-item.active .title {
            color: var(--text-primary);
        }

        .conv-item .delete-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            transition: var(--transition);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
        }

        .conv-item:hover .delete-btn {
            opacity: 1;
        }

        .conv-item .delete-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* Sidebar Footer */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--bg-tertiary);
        }

        .sidebar-footer .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .sidebar-footer .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .sidebar-footer .actions {
            display: flex;
            gap: 4px;
        }

        .sidebar-footer .actions button {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
            transition: var(--transition);
            font-size: 13px;
        }

        .sidebar-footer .actions button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-footer .actions button.danger:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        /* ===== CHAT PANEL ===== */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            min-width: 0;
        }

        /* Chat Header */
        .chat-header {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .chat-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            opacity: 0.5;
        }

        .chat-header .info h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .chat-header .info p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .chat-header .model-badge {
            padding: 4px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        /* Message Styles */
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: var(--primary);
            color: white;
        }

        .message.ai .avatar {
            background: var(--bg-card);
            color: var(--secondary);
            border: 1px solid var(--border-color);
        }

        .message .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: var(--bg-card);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message .bubble .label {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.6;
            margin-bottom: 4px;
            display: block;
        }

        /* Code Block */
        .code-block {
            background: #0d0d14;
            border-radius: var(--radius-sm);
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .code-block .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .code-block .code-header .lang {
            color: #34d399;
            font-weight: 600;
        }

        .code-block .code-header .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .code-block .code-header .copy-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .code-block pre {
            margin: 0;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Thinking Animation */
        .thinking {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .thinking .dots {
            display: flex;
            gap: 4px;
        }

        .thinking .dots span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: thinkingDot 1.4s infinite;
        }

        .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinkingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ===== CHAT INPUT ===== */
        .chat-input-container {
            padding: 12px 20px 16px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 4px;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .chat-input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.5;
        }

        .chat-input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .chat-input-wrapper .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .chat-input-wrapper .send-btn:hover {
            background: var(--secondary);
            transform: scale(1.02);
        }

        .chat-input-wrapper .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== TOAST NOTIFICATION ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-glow);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            .sidebar.collapsed {
                width: 56px;
            }
            .message .bubble {
                max-width: 90%;
            }
            .chat-header .model-badge {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                position: fixed;
                top: 40px;
                left: 0;
                bottom: 0;
                z-index: 100;
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar.collapsed {
                width: 280px;
                transform: translateX(-100%);
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 40px;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 99;
            }
            .sidebar-overlay.active {
                display: block;
            }
            .chat-header .info h2 {
                font-size: 14px;
            }
            .chat-messages {
                padding: 12px 16px;
            }
            .chat-input-container {
                padding: 8px 12px 12px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Mobile Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- App Container -->
    <div class="app-container">

        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-left">
                <span class="icon">✦</span>
                <span>DeepSeek AI</span>
            </div>
            <div class="title-bar-right">
                <button class="window-btn" onclick="window.minimize()">─</button>
                <button class="window-btn" onclick="window.maximize()">□</button>
                <button class="window-btn close" onclick="window.close()">✕</button>
            </div>
        </div>

        <!-- Main Layout -->
        <div class="main-layout">

            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="brand">
                        <span class="logo">✦</span>
                        <div class="brand-text">
                            <span class="name">DeepSeek</span>
                            <span class="sub">AI Assistant</span>
                        </div>
                    </div>
                    <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
                        <i class="fas fa-chevron-left" id="toggleIcon"></i>
                    </button>
                </div>

                <button class="new-chat-btn" onclick="newChat()">
                    <i class="fas fa-plus"></i> New Chat
                </button>

                <div class="conv-list" id="convList"></div>

                <div class="sidebar-footer">
                    <div class="status">
                        <span class="dot"></span>
                        Online
                    </div>
                    <div class="actions">
                        <button onclick="clearMessages()" class="danger" title="Clear messages">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button onclick="exportChat()" title="Export chat">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat Panel -->
            <div class="chat-panel">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="info">
                        <h2>💬 Chat with DeepSeek</h2>
                        <p>Intelligent AI Assistant</p>
                    </div>
                    <span class="model-badge">✦ DeepSeek V4 Pro</span>
                </div>

                <!-- Messages -->
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will be rendered here -->
                </div>

                <!-- Input -->
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea id="chatInput" placeholder="Type your message..." rows="1"></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        const state = {
            conversations: [],
            currentIndex: -1,
            currentHistory: [],
            isSending: false,
            isSidebarCollapsed: false,
            codeBlocks: {},
            codeIdCounter: 0,
        };

        // API Configuration (⚠️ Thay bằng API key của bạn)
        const API_KEY = 'sk-53ecd824d3610ee9742057d0aa15e9dca39d258950b0a47929e0f9b130f75a9c';
        const API_URL = 'https://api.vilao.ai/v1/chat/completions';

        // DOM refs
        const $ = (id) => document.getElementById(id);
        const chatMessages = $('chatMessages');
        const chatInput = $('chatInput');
        const sendBtn = $('sendBtn');
        const convList = $('convList');
        const sidebar = $('sidebar');
        const toggleIcon = $('toggleIcon');
        const toast = $('toast');
        const overlay = $('sidebarOverlay');

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
            if (state.conversations.length === 0) {
                newChat();
            } else {
                loadConversation(state.conversations.length - 1);
            }
            renderConvList();

            // Auto-resize textarea
            chatInput.addEventListener('input', autoResize);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Mobile toggle
            const mobileToggle = document.querySelector('.title-bar-left .icon');
            mobileToggle?.addEventListener('click', () => {
                sidebar.classList.toggle('open');
                overlay.classList.toggle('active');
            });
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            });

            // Check API key
            if (!API_KEY || API_KEY === 'sk-') {
                addSystemMessage('⚠️ Please configure API Key in the code!');
            }
        });

        // ============================================================
        // SIDEBAR TOGGLE
        // ============================================================
        function toggleSidebar() {
            state.isSidebarCollapsed = !state.isSidebarCollapsed;
            sidebar.classList.toggle('collapsed');
            toggleIcon.className = state.isSidebarCollapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-left';
        }

        // ============================================================
        // CONVERSATION MANAGEMENT
        // ============================================================
        function newChat() {
            if (state.currentHistory.length > 0) {
                saveCurrentConversation();
            }

            const conv = {
                id: state.conversations.length,
                title: `Chat ${state.conversations.length + 1}`,
                history: [],
                created_at: new Date().toLocaleString(),
            };

            state.conversations.push(conv);
            state.currentIndex = state.conversations.length - 1;
            state.currentHistory = [];
            state.codeBlocks = {};
            state.codeIdCounter = 0;

            renderChat();
            renderConvList();
            saveConversations();

            // Close mobile sidebar
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        function loadConversation(index) {
            if (index < 0 || index >= state.conversations.length) return;
            saveCurrentConversation();

            state.currentIndex = index;
            state.currentHistory = state.conversations[index].history.slice();
            state.codeBlocks = {};
            state.codeIdCounter = 0;

            renderChat();
            renderConvList();
        }

        function deleteConversation(index) {
            if (!confirm('Delete this conversation?')) return;
            state.conversations.splice(index, 1);

            if (state.currentIndex === index) {
                state.currentIndex = -1;
                state.currentHistory = [];
                state.codeBlocks = {};
                state.codeIdCounter = 0;
                if (state.conversations.length > 0) {
                    loadConversation(0);
                } else {
                    newChat();
                }
            } else if (state.currentIndex > index) {
                state.currentIndex--;
            }

            renderConvList();
            saveConversations();
        }

        function saveCurrentConversation() {
            if (state.currentIndex >= 0 && state.currentHistory.length > 0) {
                state.conversations[state.currentIndex].history = state.currentHistory.slice();
                saveConversations();
            }
        }

        // ============================================================
        // STORAGE
        // ============================================================
        function saveConversations() {
            try {
                localStorage.setItem('deepseek_conversations', JSON.stringify(state.conversations));
            } catch (e) { /* ignore */ }
        }

        function loadConversations() {
            try {
                const data = localStorage.getItem('deepseek_conversations');
                if (data) {
                    state.conversations = JSON.parse(data);
                }
            } catch (e) {
                state.conversations = [];
            }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderChat() {
            chatMessages.innerHTML = '';

            if (state.currentIndex < 0) {
                chatMessages.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);">
                        <div style="text-align:center;">
                            <div style="font-size:48px;margin-bottom:12px;">✦</div>
                            <p style="font-size:18px;font-weight:600;color:var(--text-secondary);">DeepSeek AI</p>
                            <p style="font-size:14px;">Start a new conversation to begin</p>
                        </div>
                    </div>
                `;
                return;
            }

            const conv = state.conversations[state.currentIndex];
            if (state.currentHistory.length === 0) {
                // Welcome message
                const html = `
                    <div style="padding:8px 0;text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:16px;">
                        ${conv.created_at}
                    </div>
                    <div class="message ai">
                        <div class="avatar">✦</div>
                        <div class="bubble">
                            <span class="label">DeepSeek AI</span>
                            👋 Hello! I'm DeepSeek AI, your intelligent assistant.<br>
                            Ask me anything you'd like to know!
                        </div>
                    </div>
                `;
                chatMessages.innerHTML = html;
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }

            let html = `
                <div style="padding:8px 0;text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:16px;">
                    ${conv.created_at}
                </div>
            `;

            for (const msg of state.currentHistory) {
                if (msg.role === 'user') {
                    html += `
                        <div class="message user">
                            <div class="avatar"><i class="fas fa-user"></i></div>
                            <div class="bubble">
                                <span class="label">You</span>
                                ${escapeHtml(msg.content)}
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="message ai">
                            <div class="avatar">✦</div>
                            <div class="bubble">
                                <span class="label">DeepSeek AI</span>
                                ${renderContent(msg.content)}
                            </div>
                        </div>
                    `;
                }
            }

            chatMessages.innerHTML = html;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function renderContent(text) {
            // Process code blocks
            const parts = text.split(/(```[\s\S]*?```)/);
            let html = '';

            for (const part of parts) {
                if (!part.trim()) continue;

                if (part.startsWith('```') && part.endsWith('```')) {
                    const codeContent = part.slice(3, -3).trim();
                    const lines = codeContent.split('\n');
                    const lang = lines[0] || '';
                    const codeLines = lines.slice(1).join('\n');

                    state.codeIdCounter++;
                    const codeId = state.codeIdCounter;
                    state.codeBlocks[codeId] = codeLines;

                    html += `
                        <div class="code-block">
                            <div class="code-header">
                                <span class="lang">📝 ${lang}</span>
                                <button class="copy-btn" onclick="copyCode(${codeId})">
                                    <i class="fas fa-copy"></i> Copy
                                </button>
                            </div>
                            <pre>${escapeHtml(codeLines)}</pre>
                        </div>
                    `;
                } else {
                    html += `<span>${escapeHtml(part)}</span>`;
                }
            }

            return html;
        }

        function renderConvList() {
            if (state.conversations.length === 0) {
                convList.innerHTML = `
                    <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">
                        No conversations yet
                    </div>
                `;
                return;
            }

            let html = '';
            for (let i = 0; i < state.conversations.length; i++) {
                const conv = state.conversations[i];
                const active = i === state.currentIndex ? 'active' : '';
                html += `
                    <div class="conv-item ${active}" onclick="loadConversation(${i})">
                        <span class="title">${escapeHtml(conv.title)}</span>
                        <button class="delete-btn" onclick="event.stopPropagation();deleteConversation(${i})">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            }
            convList.innerHTML = html;
        }

        // ============================================================
        // MESSAGES
        // ============================================================
        function addMessage(content, role) {
            state.currentHistory.push({ role, content });
            renderChat();
            saveCurrentConversation();
            renderConvList();
        }

        function addSystemMessage(text) {
            const html = `
                <div class="message ai">
                    <div class="avatar">⚠️</div>
                    <div class="bubble" style="border-color:#f59e0b;">
                        <span class="label" style="color:#f59e0b;">System</span>
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', html);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showThinking() {
            const html = `
                <div class="message ai" id="thinkingMsg">
                    <div class="avatar">✦</div>
                    <div class="bubble">
                        <div class="thinking">
                            <span>AI is thinking</span>
                            <div class="dots">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', html);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById('thinkingMsg');
            if (el) el.remove();
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            if (state.isSending) return;

            const input = chatInput.value.trim();
            if (!input) return;

            if (!API_KEY || API_KEY === 'sk-') {
                addSystemMessage('⚠️ Please configure API Key in the code!');
                return;
            }

            state.isSending = true;
            sendBtn.disabled = true;
            chatInput.disabled = true;

            // Update conversation title
            if (state.currentHistory.length === 0 && state.currentIndex >= 0) {
                const title = input.length > 30 ? input.slice(0, 30) + '...' : input;
                state.conversations[state.currentIndex].title = title;
                renderConvList();
                saveConversations();
            }

            addMessage(input, 'user');
            chatInput.value = '';
            autoResize();

            showThinking();

            try {
                await askAI(input);
            } catch (error) {
                removeThinking();
                addSystemMessage(`❌ Error: ${error.message}`);
            } finally {
                state.isSending = false;
                sendBtn.disabled = false;
                chatInput.disabled = false;
                chatInput.focus();
            }
        }

        async function askAI(userInput) {
            const messages = state.currentHistory.map(m => ({
                role: m.role,
                content: m.content
            }));

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`,
                },
                body: JSON.stringify({
                    model: 'deepseek/deepseek-v4-pro',
                    messages: messages,
                    stream: false,
                }),
            });

            const data = await response.json();

            if (!response.ok) {
                if (data.error?.message?.includes('API key')) {
                    throw new Error('Invalid API Key! Please check your API key.');
                }
                throw new Error(data.error?.message || 'Unknown API error');
            }

            const aiText = data.choices?.[0]?.message?.content;
            if (!aiText) throw new Error('No response from AI');

            removeThinking();
            addMessage(aiText, 'assistant');
        }

        // ============================================================
        // UTILITIES
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function autoResize() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        }

        function copyCode(codeId) {
            const code = state.codeBlocks[codeId];
            if (code) {
                navigator.clipboard?.writeText(code).then(() => {
                    showToast(`✅ Copied code #${codeId}!`);
                }).catch(() => {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = code;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`✅ Copied code #${codeId}!`);
                });
            }
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function clearMessages() {
            if (state.currentIndex < 0) return;
            if (!confirm('Clear all messages?')) return;

            state.currentHistory = [];
            state.conversations[state.currentIndex].history = [];
            state.codeBlocks = {};
            state.codeIdCounter = 0;
            saveConversations();
            renderChat();
            renderConvList();
        }

        function exportChat() {
            if (state.currentHistory.length === 0) {
                showToast('No messages to export');
                return;
            }

            let text = '✦ DeepSeek AI - Conversation Export\n';
            text += `Exported: ${new Date().toLocaleString()}\n`;
            text += '='.repeat(60) + '\n\n';

            for (const msg of state.currentHistory) {
                if (msg.role === 'user') {
                    text += `🧑 You:\n${msg.content}\n\n`;
                } else {
                    text += `🤖 DeepSeek AI:\n${msg.content}\n\n`;
                }
            }

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_export_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ Chat exported!');
        }

        // ============================================================
        // WINDOW CONTROLS (Electron-like)
        // ============================================================
        // These are dummy functions - in a real app, you'd use Electron's IPC
        window.minimize = () => {
            if (window.electron?.minimize) window.electron.minimize();
            else showToast('Minimize (use in Electron)');
        };
        window.maximize = () => {
            if (window.electron?.maximize) window.electron.maximize();
            else showToast('Maximize (use in Electron)');
        };
        window.close = () => {
            if (window.electron?.close) window.electron.close();
            else if (confirm('Close application?')) window.close();
        };
    </script>

</body>
</html>
