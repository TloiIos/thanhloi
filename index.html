<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thành Lợi Pro - Xác nhận thiết bị</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Inter', sans-serif;
            background: #0a0a0f;
            color: #f0f0ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e1e2f;
            border-radius: 20px;
            border: 1px solid #2a2a40;
            padding: 40px 32px;
            box-shadow: 0 0 60px rgba(124, 58, 237, 0.15);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #7c3aed, #8b5cf6, #a78bfa);
        }
        .logo {
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: #8b5cf6;
            margin-bottom: 8px;
        }
        .logo span { color: #a78bfa; }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6b6b88;
            margin-bottom: 24px;
        }
        .device-info {
            background: #0a0a0f;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #2a2a40;
        }
        .device-info .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a40;
            font-size: 13px;
        }
        .device-info .row:last-child { border-bottom: none; }
        .device-info .label { color: #6b6b88; }
        .device-info .value { 
            color: #a78bfa; 
            font-family: monospace;
            font-weight: 600;
            word-break: break-all;
            max-width: 60%;
            text-align: right;
        }
        .btn-confirm {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 30px rgba(124, 58, 237, 0.4);
        }
        .btn-confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-confirm i { font-size: 20px; }
        .status-msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .status-msg.show { display: block; }
        .status-msg.loading { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .status-msg.success { background: rgba(52, 211, 153, 0.15); color: #34d399; }
        .status-msg.error { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        
        .note {
            margin-top: 16px;
            font-size: 12px;
            color: #6b6b88;
            text-align: center;
        }
        .note i { color: #8b5cf6; }
        
        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-to-app {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            color: #6b6b88;
        }
        .back-to-app a {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
        }
        .back-to-app a:hover { text-decoration: underline; }
        
        .status-badge {
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.active { background: rgba(52, 211, 153, 0.15); color: #34d399; }
        .status-badge.banned { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .status-badge.pending { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
        
        /* iPhone Model Badge */
        .model-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }
        
        .device-icon {
            font-size: 32px;
            text-align: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">✦ Thành <span>Lợi</span></div>
        <div class="title">📱 Xác nhận thiết bị</div>
        <div class="subtitle">Xác nhận thiết bị để sử dụng ứng dụng</div>
        
        <div class="device-icon" id="deviceIcon">📱</div>

        <div class="device-info">
            <div class="row">
                <span class="label">📱 Thiết bị</span>
                <span class="value" id="deviceNameDisplay">Đang tải...</span>
            </div>
            <div class="row">
                <span class="label">🏷️ Model</span>
                <span class="value" id="modelDisplay"><span class="model-badge">iPhone</span></span>
            </div>
            <div class="row">
                <span class="label">🔑 UID</span>
                <span class="value" id="uidDisplay">Đang tải...</span>
            </div>
            <div class="row">
                <span class="label">📅 Thời gian</span>
                <span class="value" id="timeDisplay">Đang tải...</span>
            </div>
            <div class="row">
                <span class="label">📊 Trạng thái</span>
                <span class="value" id="statusDisplay"><span class="status-badge pending">⏳ Chờ xác nhận</span></span>
            </div>
        </div>

        <button class="btn-confirm" id="confirmBtn" onclick="confirmDevice()">
            <i class="fas fa-check-circle"></i> Xác nhận thiết bị
        </button>

        <div class="status-msg" id="statusMsg"></div>

        <div class="back-to-app" id="backToApp" style="display:none;">
            <i class="fas fa-arrow-left"></i> 
            <a href="#" onclick="goBackToApp()">Quay lại ứng dụng</a>
        </div>

        <div class="note">
            <i class="fas fa-info-circle"></i> Sau khi xác nhận, bạn sẽ được chuyển về ứng dụng để nhập API Key
        </div>
    </div>

    <script>
        // Firebase Config
        const FIREBASE_URL = 'https://apikey-69de8-default-rtdb.asia-southeast1.firebasedatabase.app';
        const DEVICES_URL = FIREBASE_URL + '/devices';
        const BANNED_URL = FIREBASE_URL + '/banned_devices';
        
        // URL Scheme để quay lại app
        const APP_SCHEME = 'pubg://';
        
        let currentUid = '';
        let deviceName = '';
        let deviceModel = '';
        let isRegistered = false;
        let deviceKey = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Lấy thông tin từ URL
            const params = new URLSearchParams(window.location.search);
            currentUid = params.get('uid') || '';
            deviceName = params.get('device') || getDeviceName();
            deviceModel = getDeviceModel();
            
            // Hiển thị thông tin
            document.getElementById('uidDisplay').textContent = currentUid || 'Không có UID';
            document.getElementById('deviceNameDisplay').textContent = deviceName || 'Không có tên';
            document.getElementById('modelDisplay').innerHTML = `<span class="model-badge">${deviceModel}</span>`;
            document.getElementById('timeDisplay').textContent = new Date().toLocaleString('vi-VN');
            
            // Set icon theo model
            updateDeviceIcon(deviceModel);
            
            if (!currentUid) {
                showStatus('❌ Không tìm thấy UID. Vui lòng mở lại từ ứng dụng.', 'error');
                document.getElementById('confirmBtn').disabled = true;
                return;
            }
            
            // Kiểm tra trạng thái thiết bị
            checkDeviceStatus();
        });

        function getDeviceModel() {
            const ua = navigator.userAgent;
            
            // iPhone Models
            if (ua.includes('iPhone')) {
                // iPhone 16 series
                if (ua.includes('iPhone17,1')) return 'iPhone 16 Pro';
                if (ua.includes('iPhone17,2')) return 'iPhone 16 Pro Max';
                if (ua.includes('iPhone17,3')) return 'iPhone 16';
                if (ua.includes('iPhone17,4')) return 'iPhone 16 Plus';
                
                // iPhone 15 series
                if (ua.includes('iPhone16,1')) return 'iPhone 15 Pro';
                if (ua.includes('iPhone16,2')) return 'iPhone 15 Pro Max';
                if (ua.includes('iPhone16,3')) return 'iPhone 15';
                if (ua.includes('iPhone16,4')) return 'iPhone 15 Plus';
                
                // iPhone 14 series
                if (ua.includes('iPhone15,2')) return 'iPhone 14 Pro';
                if (ua.includes('iPhone15,3')) return 'iPhone 14 Pro Max';
                if (ua.includes('iPhone15,4')) return 'iPhone 14';
                if (ua.includes('iPhone15,5')) return 'iPhone 14 Plus';
                
                // iPhone 13 series
                if (ua.includes('iPhone14,5')) return 'iPhone 13';
                if (ua.includes('iPhone14,2')) return 'iPhone 13 Pro';
                if (ua.includes('iPhone14,3')) return 'iPhone 13 Pro Max';
                if (ua.includes('iPhone14,4')) return 'iPhone 13 Mini';
                
                // iPhone 12 series
                if (ua.includes('iPhone13,1')) return 'iPhone 12 Mini';
                if (ua.includes('iPhone13,2')) return 'iPhone 12';
                if (ua.includes('iPhone13,3')) return 'iPhone 12 Pro';
                if (ua.includes('iPhone13,4')) return 'iPhone 12 Pro Max';
                
                // iPhone 11 series
                if (ua.includes('iPhone12,1')) return 'iPhone 11';
                if (ua.includes('iPhone12,3')) return 'iPhone 11 Pro';
                if (ua.includes('iPhone12,5')) return 'iPhone 11 Pro Max';
                
                // iPhone XS/XS Max/XR
                if (ua.includes('iPhone11,2')) return 'iPhone XS';
                if (ua.includes('iPhone11,4') || ua.includes('iPhone11,6')) return 'iPhone XS Max';
                if (ua.includes('iPhone11,8')) return 'iPhone XR';
                
                // iPhone X
                if (ua.includes('iPhone10,3') || ua.includes('iPhone10,6')) return 'iPhone X';
                
                // iPhone 8 series
                if (ua.includes('iPhone10,1') || ua.includes('iPhone10,4')) return 'iPhone 8';
                if (ua.includes('iPhone10,2') || ua.includes('iPhone10,5')) return 'iPhone 8 Plus';
                
                // iPhone 7 series
                if (ua.includes('iPhone9,1') || ua.includes('iPhone9,3')) return 'iPhone 7';
                if (ua.includes('iPhone9,2') || ua.includes('iPhone9,4')) return 'iPhone 7 Plus';
                
                // iPhone SE series
                if (ua.includes('iPhone8,4')) return 'iPhone SE (1st gen)';
                if (ua.includes('iPhone14,6')) return 'iPhone SE (2nd gen)';
                if (ua.includes('iPhone15,6')) return 'iPhone SE (3rd gen)';
                
                return 'iPhone';
            }
            
            // iPad Models
            if (ua.includes('iPad')) {
                if (ua.includes('iPad13,4') || ua.includes('iPad13,5') || 
                    ua.includes('iPad13,6') || ua.includes('iPad13,7')) return 'iPad Pro 11" (3rd gen)';
                if (ua.includes('iPad13,8') || ua.includes('iPad13,9') || 
                    ua.includes('iPad13,10') || ua.includes('iPad13,11')) return 'iPad Pro 12.9" (5th gen)';
                if (ua.includes('iPad14,1') || ua.includes('iPad14,2')) return 'iPad Mini (6th gen)';
                if (ua.includes('iPad14,3') || ua.includes('iPad14,4')) return 'iPad Air (4th gen)';
                return 'iPad';
            }
            
            // Mac
            if (ua.includes('Macintosh')) {
                return 'Mac';
            }
            
            // Android
            if (ua.includes('Android')) {
                return 'Android';
            }
            
            return 'Unknown Device';
        }

        function updateDeviceIcon(model) {
            const icon = document.getElementById('deviceIcon');
            if (model.includes('Pro Max') || model.includes('Plus')) {
                icon.textContent = '📱📱';
            } else if (model.includes('Pro')) {
                icon.textContent = '📱';
            } else if (model.includes('iPad')) {
                icon.textContent = '📄';
            } else if (model.includes('Mac')) {
                icon.textContent = '💻';
            } else if (model.includes('Android')) {
                icon.textContent = '📱';
            } else {
                icon.textContent = '📱';
            }
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (ua.includes('iPhone')) return 'iPhone';
            if (ua.includes('iPad')) return 'iPad';
            if (ua.includes('Mac')) return 'Mac';
            if (ua.includes('Android')) return 'Android';
            if (ua.includes('Windows')) return 'Windows PC';
            return 'Unknown Device';
        }

        async function checkDeviceStatus() {
            try {
                const response = await fetch(`${DEVICES_URL}.json?orderBy="uid"&equalTo="${currentUid}"`);
                if (!response.ok) throw new Error('Không thể kiểm tra');
                
                const data = await response.json();
                let found = false;
                
                for (const [key, device] of Object.entries(data)) {
                    if (device.uid === currentUid) {
                        found = true;
                        deviceKey = key;
                        const status = device.status || 'pending';
                        const statusMap = {
                            'active': '<span class="status-badge active">✅ Đã xác nhận</span>',
                            'banned': '<span class="status-badge banned">🚫 Bị khóa</span>',
                            'pending': '<span class="status-badge pending">⏳ Chờ xác nhận</span>'
                        };
                        document.getElementById('statusDisplay').innerHTML = statusMap[status] || statusMap.pending;
                        isRegistered = true;
                        
                        // Nếu đã active, hiển thị nút quay lại
                        if (status === 'active') {
                            document.getElementById('backToApp').style.display = 'block';
                            document.getElementById('confirmBtn').disabled = true;
                            document.getElementById('confirmBtn').innerHTML = '<i class="fas fa-check-circle"></i> Đã xác nhận';
                        }
                        break;
                    }
                }
                
                if (!found) {
                    document.getElementById('statusDisplay').innerHTML = '<span class="status-badge pending">⏳ Chưa đăng ký</span>';
                }
            } catch (error) {
                console.error('Lỗi kiểm tra:', error);
            }
        }

        async function confirmDevice() {
            const btn = document.getElementById('confirmBtn');
            const status = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Đang xác nhận...';
            
            showStatus('⏳ Đang xác nhận thiết bị...', 'loading');

            try {
                // Kiểm tra thiết bị đã tồn tại chưa
                const checkResponse = await fetch(`${DEVICES_URL}.json?orderBy="uid"&equalTo="${currentUid}"`);
                const checkData = await checkResponse.json();
                
                let exists = false;
                let existingKey = null;
                
                for (const [key, device] of Object.entries(checkData)) {
                    if (device.uid === currentUid) {
                        exists = true;
                        existingKey = key;
                        break;
                    }
                }
                
                let result;
                
                if (exists && existingKey) {
                    // Cập nhật thiết bị đã tồn tại
                    const updateData = {
                        status: 'active',
                        device_name: deviceName,
                        device_model: deviceModel,
                        confirmed_at: Date.now(),
                        last_active: Date.now(),
                        updated_at: Date.now()
                    };
                    
                    const updateResponse = await fetch(`${DEVICES_URL}/${existingKey}.json`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updateData)
                    });
                    
                    if (!updateResponse.ok) throw new Error('Không thể cập nhật');
                    result = await updateResponse.json();
                } else {
                    // Tạo mới thiết bị
                    const newDevice = {
                        uid: currentUid,
                        device_name: deviceName,
                        device_model: deviceModel,
                        registered_at: Date.now(),
                        confirmed_at: Date.now(),
                        status: 'active',
                        attempts: 0,
                        success_count: 0,
                        last_active: Date.now(),
                        created_at: Date.now()
                    };
                    
                    const createResponse = await fetch(`${DEVICES_URL}.json`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newDevice)
                    });
                    
                    if (!createResponse.ok) throw new Error('Không thể tạo thiết bị');
                    result = await createResponse.json();
                }
                
                showStatus('✅ Xác nhận thành công! Thiết bị đã được đăng ký.', 'success');
                document.getElementById('statusDisplay').innerHTML = '<span class="status-badge active">✅ Đã xác nhận</span>';
                document.getElementById('backToApp').style.display = 'block';
                document.getElementById('confirmBtn').innerHTML = '<i class="fas fa-check-circle"></i> Đã xác nhận';
                
                // Lưu vào localStorage để biết đã xác nhận
                localStorage.setItem('device_confirmed', 'true');
                localStorage.setItem('device_uid', currentUid);
                localStorage.setItem('device_model', deviceModel);
                
                // Tự động quay lại app sau 2 giây
                setTimeout(() => {
                    goBackToApp();
                }, 2000);
                
            } catch (error) {
                console.error('Lỗi:', error);
                showStatus('❌ Lỗi xác nhận: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Xác nhận thiết bị';
                setTimeout(() => {
                    document.getElementById('statusMsg').classList.remove('show');
                }, 5000);
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('statusMsg');
            status.textContent = message;
            status.className = 'status-msg show ' + type;
        }

        function goBackToApp() {
            // Thử mở app bằng URL Scheme
            const appUrl = `${APP_SCHEME}?action=confirmed&uid=${currentUid}&model=${encodeURIComponent(deviceModel)}`;
            window.location.href = appUrl;
            
            // Fallback: nếu không mở được, hiển thị hướng dẫn
            setTimeout(() => {
                document.getElementById('backToApp').innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i> 
                    Không thể mở ứng dụng? 
                    <a href="#" onclick="copyUid()">Sao chép UID</a> và mở lại ứng dụng
                `;
            }, 3000);
        }

        function copyUid() {
            navigator.clipboard.writeText(currentUid).then(() => {
                showStatus('✅ Đã sao chép UID: ' + currentUid, 'success');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = currentUid;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showStatus('✅ Đã sao chép UID: ' + currentUid, 'success');
            });
        }
        
        // Tự động kiểm tra lại trạng thái mỗi 10 giây
        setInterval(checkDeviceStatus, 10000);
    </script>
</body>
</html>
